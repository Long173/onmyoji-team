name: Crawl và publish báo cáo

on:
  push:
    branches: [main]
  schedule:
    # 01:00 UTC mỗi ngày (08:00 giờ VN)
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache ảnh 式神 và ngự hồn
        uses: actions/cache@v4
        with:
          path: |
            assets/avatars
            assets/yuhun
          key: onmyoji-images-v2

      - name: Crawl bảng đội hình
        run: python3 crawl_team_rank.py --slug team-rank-current

      - name: Crawl bảng xếp hạng 式神
        run: python3 crawl_shishen_rank.py --slug shishen-rank-current

      # CI KHÔNG crawl được dữ liệu hội viên: refresh token của yysrank.win dùng
      # một lần và site chỉ cho một session (409 重复登录), nên CI refresh sẽ
      # đăng xuất người dùng khỏi browser và ngược lại. Vì vậy khối dữ liệu đó
      # được build tại máy rồi commit ở prebuilt/paid.json; build_report.py tự
      # trộn vào, nên trang chỉ có MỘT bản duy nhất chứa đủ mọi thứ.
      - name: Crawl trend và đội hình theo 式神
        run: python3 crawl_shishen_detail.py --no-token

      # Nhãn vai trò, thống kê site, độ nóng — cả ba endpoint đều MỞ nên CI lấy được.
      - name: Crawl nhãn vai trò và thống kê site
        run: python3 crawl_extras.py

      - name: Dựng báo cáo
        run: |
          if [ -f prebuilt/paid.json ]; then
            echo "Có prebuilt/paid.json — trang sẽ gồm cả dữ liệu hội viên."
          else
            echo "Không có prebuilt/paid.json — trang chỉ có dữ liệu mở."
          fi
          python3 build_report.py \
            --version-label "Phiên bản hiện hành" \
            --data-links \
            --output site/index.html

      - name: Kèm dữ liệu thô để tải về
        run: |
          cp out/team-rank-current.json out/team-rank-current.csv site/
          cp out/shishen-rank-current.json out/shishen-detail-current.json site/
          cp out/extras-current.json site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
