name: Crawl và publish báo cáo

on:
  push:
    branches: [main]
  schedule:
    # 01:00 UTC mỗi ngày (08:00 giờ VN)
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache ảnh 式神 và ngự hồn
        uses: actions/cache@v4
        with:
          path: |
            assets/avatars
            assets/yuhun
          key: onmyoji-images-v2

      - name: Crawl bảng đội hình
        run: python3 crawl_team_rank.py --slug team-rank-current

      - name: Crawl bảng xếp hạng 式神
        run: python3 crawl_shishen_rank.py --slug shishen-rank-current

      - name: Crawl trend và đội hình theo 式神
        # --no-token: bản publish CHỈ được chứa dữ liệu mở. Runner không có token,
        # nhưng khai tường minh để không bao giờ vô tình lấy dữ liệu sau tường phí.
        run: python3 crawl_shishen_detail.py --no-token

      - name: Dựng báo cáo
        # KHÔNG có --include-paid: dữ liệu hội viên basic không được publish.
        run: |
          python3 build_report.py \
            --version-label "Phiên bản hiện hành" \
            --data-links \
            --output site/index.html

      - name: Kèm dữ liệu thô để tải về
        run: |
          cp out/team-rank-current.json out/team-rank-current.csv site/
          cp out/shishen-rank-current.json out/shishen-detail-current.json site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
