name: Crawl và publish báo cáo

on:
  push:
    branches: [main]
  schedule:
    # 01:00 UTC mỗi ngày (08:00 giờ VN)
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache avatar 式神
        uses: actions/cache@v4
        with:
          path: assets/avatars
          key: shishen-avatars-v1

      - name: Crawl bảng đội hình
        run: python3 crawl_team_rank.py --slug team-rank-current

      - name: Dựng báo cáo
        run: |
          python3 build_report.py \
            --version-label "Phiên bản hiện hành" \
            --data-links \
            --output site/index.html

      - name: Kèm dữ liệu thô để tải về
        run: cp out/team-rank-current.json out/team-rank-current.csv site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
